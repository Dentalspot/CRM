name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # permite ejecutar manualmente desde GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Security audit informativo: reporta vulnerabilidades pero NO bloquea
      # el deploy. Las vulns de dependencias transitivas (especialmente
      # dev-tooling y severidades teóricas como ReDoS) aparecen seguido y no
      # deben acoplar la seguridad-de-deps con el pipeline de entrega.
      # Las vulns se gestionan aparte (npm audit fix periódico + revisión).
      # Antes era continue-on-error: false con --audit-level=high → bloqueaba
      # todos los deploys cuando había 1 high/critical (caso 2026-05-26).
      - name: Security audit (informativo)
        run: npm audit --audit-level=critical --omit=dev || true
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_META_DATASET_ID: ${{ secrets.VITE_META_DATASET_ID }}
          # Sentry — tracking de errores en prod (no-op si DSN vacío)
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: true  # Borra archivos viejos antes de subir
